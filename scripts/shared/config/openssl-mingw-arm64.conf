# OpenSSL Configure target for Windows on arm64 with llvm-mingw, loaded by
# build_libsmb2_windows.sh with `--config`. OpenSSL 3.5 has mingw targets for
# x86 and x86_64 only; this one is mingw64 without its x86_64 parts (-m64,
# the assembler scheme), so libcrypto builds in plain C (no-asm).

my %targets = (
    "mingw-arm64" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGW64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        asm_arch         => undef,
        perlasm_scheme   => undef,
        uplink_arch      => undef,
        multilib         => "64",
    },
);
